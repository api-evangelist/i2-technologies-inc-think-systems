description: 'i2 Technologies Inc was a Dallas-based supply-chain management software company founded in
  1988 by Sanjiv Sidhu and Ken Sharma; "THINK SYSTEMS" refers to Think Systems Inc, a supply-chain planning
  software firm i2 acquired in 1997. i2 Technologies was itself acquired by JDA Software in 2010, which
  rebranded to Blue Yonder in 2020 and is now owned by Panasonic. This is a defunct/historical entity with
  no independent, live developer or API surface. The enrichment pass found no attributable API to enrich;
  the live i2group.com intelligence-analysis APIs belong to a different, unrelated company (a name collision),
  and the "insight-partners" backing appears to be an erroneous VC-portfolio match.'
